name: backend-deploy

# main への push で backend/ を manage.ka2.org へ配備する。手動実行も可。
# 必要な Secrets: DEPLOY_SSH_KEY(専用鍵), DEPLOY_KNOWN_HOSTS(ssh-keyscan の出力), DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: PHP 構文検査(自作コードのみ)
        run: |
          find public/content/mu-plugins scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: 依存を取得(コア・プラグイン)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: SSH 設定
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: rsync
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}
        run: |
          # wp-config.php と uploads は本番固有のため同期・削除の対象外にする
          rsync -rlptz --delete \
            --exclude='/wp-config.php' \
            --exclude='/assets/uploads/' \
            --exclude='/content/uploads/' \
            --exclude='/content/cache/' \
            --exclude='/content/upgrade/' \
            --exclude='/content/languages/' \
            -e 'ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes' \
            public/ "$TARGET/"
